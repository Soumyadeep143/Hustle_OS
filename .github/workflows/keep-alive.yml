name: Keep Render backend awake

on:
  schedule:
    # Every 10 minutes — Render's free tier spins down after ~15 min idle,
    # so this keeps a comfortable margin without hammering the endpoint.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf --max-time 60 https://hustleos-api.onrender.com/health
